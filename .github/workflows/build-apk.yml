name: Build Beyond The Wall APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q BeyondTheWall_Android_Project.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: BeyondTheWall_Android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BeyondTheWall-APK
          path: BeyondTheWall_Android/app/build/outputs/apk/debug/app-debug.apk
